<!doctype html>
<html>
  <head>
    <title>FortiWallet | Reset PIN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="brand-badge">FORTIWALLET</div>
      <h2>Reset PIN</h2>

      <form id="resetPinForm">
        <input type="email" name="email" placeholder="Email" required />

        <div class="pin-section">
          <p class="pin-label">New PIN</p>
          <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-input reset-pin-new" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-new" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-new" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-new" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-new" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-new" inputmode="numeric" />
          </div>
          <input type="hidden" name="newPin" id="newPinHidden" />
        </div>

        <div class="pin-section">
          <p class="pin-label">Confirm PIN</p>
          <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-input reset-pin-confirm" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-confirm" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-confirm" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-confirm" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-confirm" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input reset-pin-confirm" inputmode="numeric" />
          </div>
          <input type="hidden" name="confirmPin" id="confirmPinHidden" />
        </div>

        <button type="submit" id="resetPinSubmitBtn">Reset PIN</button>
      </form>

      <div class="link-row" style="justify-content: center">
        <a href="/login.html">Back to Login</a>
      </div>
    </div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <p id="popup-text"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="/popup.js"></script>
    <script>
      const newPinInputs = document.querySelectorAll('.reset-pin-new');
      const confirmPinInputs = document.querySelectorAll('.reset-pin-confirm');
      const newPinHidden = document.getElementById('newPinHidden');
      const confirmPinHidden = document.getElementById('confirmPinHidden');
      const resetPinSubmitBtn = document.getElementById("resetPinSubmitBtn");
      let resetPinBusy = false;

      function wirePinInputs(inputs, onUpdate) {
        inputs.forEach((input, index) => {
          input.addEventListener("input", () => {
            input.value = input.value.replace(/\D/g, "");

            if (input.value.length === 1 && index < inputs.length - 1) {
              inputs[index + 1].focus();
            }

            onUpdate();
          });

          input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && input.value === "" && index > 0) {
              inputs[index - 1].focus();
            }
          });
        });
      }

      wirePinInputs(newPinInputs, () => {
        newPinHidden.value = Array.from(newPinInputs).map((input) => input.value).join('');
      });

      wirePinInputs(confirmPinInputs, () => {
        confirmPinHidden.value = Array.from(confirmPinInputs).map((input) => input.value).join('');
      });

      document
        .getElementById("resetPinForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (resetPinBusy) return;

          newPinHidden.value = Array.from(newPinInputs).map((input) => input.value).join('');
          confirmPinHidden.value = Array.from(confirmPinInputs).map((input) => input.value).join('');

          if (newPinHidden.value !== confirmPinHidden.value) {
            return showPopup("PIN does not match");
          }

          resetPinBusy = true;
          resetPinSubmitBtn.disabled = true;
          resetPinSubmitBtn.innerText = "Updating...";
          try {
            const res = await fetch("/reset-pin", {
              method: "POST",
              body: new URLSearchParams(new FormData(e.target)),
            });

            const data = await res.json();

            if (data.success) {
              showPopup(data.message, data.redirect);
            } else {
              showPopup(data.message);
            }
          } catch (error) {
            showPopup("Unable to reset PIN right now.");
          } finally {
            resetPinBusy = false;
            resetPinSubmitBtn.disabled = false;
            resetPinSubmitBtn.innerText = "Reset PIN";
          }
        });
    </script>
  </body>
</html>

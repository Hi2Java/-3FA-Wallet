<!doctype html>
<html>
  <head>
    <title>FortiWallet | Create Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="brand-badge">FORTIWALLET</div>
      <h2>Create Account</h2>

      <form id="registerForm">
        <input type="email" name="email" placeholder="Email address" required />
        <div class="password-field">
          <input
            type="password"
            id="passwordInput"
            name="password"
            placeholder="Password"
            required
          />
          <button type="button" class="password-toggle" data-target="passwordInput" aria-label="Show password"></button>
        </div>
        <p id="passwordStrength" class="strength-hint"></p>

        <div class="pin-block">
          <p class="pin-label">Create Transaction PIN</p>
          <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-input register-pin" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input register-pin" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input register-pin" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input register-pin" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input register-pin" inputmode="numeric" />
            <input type="password" maxlength="1" class="pin-input register-pin" inputmode="numeric" />
          </div>
          <input type="hidden" name="pin" id="pinHidden" />
        </div>

        <button type="submit" id="registerSubmitBtn">Create Account</button>
      </form>

      <div class="link-row" style="justify-content: center">
        <a href="/login.html">Back to Login</a>
      </div>
    </div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <p id="popup-text"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="/popup.js"></script>
    <script>
      const passwordInput = document.getElementById("passwordInput");
      const passwordStrength = document.getElementById("passwordStrength");
      const pinInputs = document.querySelectorAll(".register-pin");
      const pinHidden = document.getElementById("pinHidden");
      const registerSubmitBtn = document.getElementById("registerSubmitBtn");
      let registerBusy = false;
      function isValidEmailFormat(email) {
        const normalized = String(email || "").trim().toLowerCase();
        if (!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/.test(normalized)) return false;

        const domain = normalized.split("@")[1];
        if (!domain || domain.includes("..")) return false;

        const allowedTlds = new Set([
          "com",
          "net",
          "org",
          "edu",
          "gov",
          "my",
          "com.my",
          "edu.my",
          "gov.my",
          "net.my",
          "org.my",
          "ac.my",
        ]);
        const parts = domain.split(".");
        const last = parts.at(-1);
        const lastTwo = parts.slice(-2).join(".");

        return allowedTlds.has(last) || allowedTlds.has(lastTwo);
      }
      document.querySelectorAll(".password-toggle").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const target = document.getElementById(toggle.dataset.target);
          const show = target.type === "password";
          target.type = show ? "text" : "password";
          toggle.classList.toggle("is-visible", show);
          toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
      });

      function wirePinInputs(inputs, onUpdate) {
        inputs.forEach((input, index) => {
          input.addEventListener("input", () => {
            input.value = input.value.replace(/\D/g, "");

            if (input.value.length === 1 && index < inputs.length - 1) {
              inputs[index + 1].focus();
            }

            onUpdate();
          });

          input.addEventListener("keydown", (e) => {
            if (e.key === "Backspace" && input.value === "" && index > 0) {
              inputs[index - 1].focus();
            }
          });
        });
      }

      wirePinInputs(pinInputs, () => {
        pinHidden.value = Array.from(pinInputs)
          .map((input) => input.value)
          .join("");
      });

      passwordInput.addEventListener("input", () => {
        const value = passwordInput.value;
        let score = 0;

        if (value.length >= 6) score += 1;
        if (/[A-Z]/.test(value) || /[a-z]/.test(value)) score += 1;
        if (/\d/.test(value)) score += 1;
        if (/[^A-Za-z0-9]/.test(value)) score += 1;
        if (value.length >= 8) score += 1;

        if (!value) {
          passwordStrength.dataset.strength = "";
          passwordStrength.innerText = "";
        } else if (score <= 2) {
          passwordStrength.dataset.strength = "weak";
          passwordStrength.innerText = "Password could be stronger.";
        } else if (score <= 4) {
          passwordStrength.dataset.strength = "medium";
          passwordStrength.innerText = "Good password.";
        } else {
          passwordStrength.dataset.strength = "strong";
          passwordStrength.innerText = "Strong password.";
        }
      });

      document
        .getElementById("registerForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (registerBusy) return;

          pinHidden.value = Array.from(pinInputs)
            .map((input) => input.value)
            .join("");

          const email = e.target.email.value.trim().toLowerCase();
          if (!isValidEmailFormat(email)) {
            return showPopup("Enter a valid email address, for example name@gmail.com.");
          }

          e.target.email.value = email;
          registerBusy = true;
          registerSubmitBtn.disabled = true;
          registerSubmitBtn.innerText = "Creating...";
          try {
            const formData = new URLSearchParams(new FormData(e.target));
            const res = await fetch("/register", {
              method: "POST",
              body: formData,
            });

            const data = await res.json();

            if (data.success) {
              showPopup(data.message, data.redirect);
            } else {
              showPopup(data.message);
            }
          } catch (error) {
            showPopup("Unable to create account right now.");
          } finally {
            registerBusy = false;
            registerSubmitBtn.disabled = false;
            registerSubmitBtn.innerText = "Create Account";
          }
        });
    </script>
  </body>
</html>

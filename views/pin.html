<!doctype html>
<html>
  <head>
    <title>FortiWallet | PIN Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="brand-badge">STEP 3 OF 3</div>
      <h2>Transaction Security</h2>

      <form id="pinForm">
        <div class="pin-input-group">
          <input type="password" maxlength="1" class="pin-input" inputmode="numeric" />
          <input type="password" maxlength="1" class="pin-input" inputmode="numeric" />
          <input type="password" maxlength="1" class="pin-input" inputmode="numeric" />
          <input type="password" maxlength="1" class="pin-input" inputmode="numeric" />
          <input type="password" maxlength="1" class="pin-input" inputmode="numeric" />
          <input type="password" maxlength="1" class="pin-input" inputmode="numeric" />
        </div>
        <input type="hidden" name="pin" id="pinHidden" />
        <button type="submit">Confirm</button>
      </form>

      <div class="link-row" style="justify-content: center">
        <a href="/dashboard">Back to Dashboard</a>
      </div>
    </div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <p id="popup-text"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="/popup.js"></script>
    <script>
      const inputs = document.querySelectorAll(".pin-input");
      const hiddenInput = document.getElementById("pinHidden");

      inputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "");

          if (input.value.length === 1 && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }

          updatePin();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && input.value === "" && index > 0) {
            inputs[index - 1].focus();
          }
        });
      });

      function updatePin() {
        let pin = "";
        inputs.forEach((input) => {
          pin += input.value;
        });
        hiddenInput.value = pin;
      }

      document
        .getElementById("pinForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          updatePin();

          const formData = new URLSearchParams(new FormData(e.target));
          const res = await fetch("/verify-pin", {
            method: "POST",
            body: formData,
          });

          const data = await res.json();

          if (data.success) {
            showPopup(data.message, data.redirect);
          } else {
            showPopup(data.message);

            if (data.forgot) {
              setTimeout(() => {
                if (confirm("Too many attempts. Reset PIN now?")) {
                  window.location.href = "/forgot-pin.html";
                }
              }, 500);
            }
          }
        });
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <title>FortiWallet | Reset Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="brand-badge">FORTIWALLET</div>
      <h2>Set New Password</h2>

      <form id="resetForm">
        <div class="pin-block">
          <p class="pin-label">Password Reset OTP</p>
          <div class="pin-input-group">
            <input type="text" maxlength="1" class="pin-input reset-otp-input" inputmode="numeric" />
            <input type="text" maxlength="1" class="pin-input reset-otp-input" inputmode="numeric" />
            <input type="text" maxlength="1" class="pin-input reset-otp-input" inputmode="numeric" />
            <input type="text" maxlength="1" class="pin-input reset-otp-input" inputmode="numeric" />
            <input type="text" maxlength="1" class="pin-input reset-otp-input" inputmode="numeric" />
            <input type="text" maxlength="1" class="pin-input reset-otp-input" inputmode="numeric" />
          </div>
          <input type="hidden" name="otp" id="resetOtpHidden" />
        </div>
        <div class="password-field">
          <input
            type="password"
            id="resetNewPassword"
            name="newPassword"
            placeholder="New Password"
            required
          />
          <button type="button" class="password-toggle" data-target="resetNewPassword" aria-label="Show password"></button>
        </div>
        <div class="password-field">
          <input
            type="password"
            id="resetConfirmPassword"
            name="confirmPassword"
            placeholder="Confirm Password"
            required
          />
          <button type="button" class="password-toggle" data-target="resetConfirmPassword" aria-label="Show password"></button>
        </div>
        <button type="submit" id="resetSubmitBtn">Reset Password</button>
      </form>

      <div class="link-row" style="justify-content: center">
        <a href="/login.html">Back to Login</a>
      </div>
    </div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <p id="popup-text"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="/popup.js"></script>
    <script>
      const resetOtpInputs = document.querySelectorAll(".reset-otp-input");
      const resetOtpHidden = document.getElementById("resetOtpHidden");
      const resetSubmitBtn = document.getElementById("resetSubmitBtn");
      let resetBusy = false;

      function updateResetOtp() {
        resetOtpHidden.value = Array.from(resetOtpInputs)
          .map((input) => input.value)
          .join("");
      }

      resetOtpInputs.forEach((input, index) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/\D/g, "");
          if (input.value.length === 1 && index < resetOtpInputs.length - 1) {
            resetOtpInputs[index + 1].focus();
          }
          updateResetOtp();
        });

        input.addEventListener("keydown", (e) => {
          if (e.key === "Backspace" && input.value === "" && index > 0) {
            resetOtpInputs[index - 1].focus();
          }
        });
      });

      document.querySelectorAll(".password-toggle").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const target = document.getElementById(toggle.dataset.target);
          const show = target.type === "password";
          target.type = show ? "text" : "password";
          toggle.classList.toggle("is-visible", show);
          toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
      });
      document
        .getElementById("resetForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (resetBusy) return;
          updateResetOtp();
          resetBusy = true;
          resetSubmitBtn.disabled = true;
          resetSubmitBtn.innerText = "Updating...";

          try {
            const formData = new URLSearchParams(new FormData(e.target));
            const res = await fetch("/reset-password", {
              method: "POST",
              body: formData,
            });
            const data = await res.json();

            if (data.success) {
              showPopup(data.message, data.redirect);
            } else {
              showPopup(data.message);
            }
          } catch (error) {
            showPopup("Unable to reset password right now.");
          } finally {
            resetBusy = false;
            resetSubmitBtn.disabled = false;
            resetSubmitBtn.innerText = "Reset Password";
          }
        });
    </script>
  </body>
</html>

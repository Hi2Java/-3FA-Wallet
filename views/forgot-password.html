<!doctype html>
<html>
  <head>
    <title>FortiWallet | Forgot Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="brand-badge">FORTIWALLET</div>
      <h2>Forgot Password</h2>

      <form id="forgotForm">
        <input
          type="email"
          name="email"
          placeholder="Enter your email"
          required
        />
        <button type="submit" id="forgotSubmitBtn">Continue</button>
      </form>

      <div class="link-row" style="justify-content: center">
        <a href="/login.html">Back to Login</a>
      </div>
    </div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <p id="popup-text"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="/popup.js"></script>
    <script>
      const forgotSubmitBtn = document.getElementById("forgotSubmitBtn");
      let forgotBusy = false;
      document
        .getElementById("forgotForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (forgotBusy) return;
          forgotBusy = true;
          forgotSubmitBtn.disabled = true;
          forgotSubmitBtn.innerText = "Sending OTP...";

          try {
            const formData = new URLSearchParams(new FormData(e.target));
            const res = await fetch("/forgot-password", {
              method: "POST",
              body: formData,
            });

            const data = await res.json();

            if (data.success) {
              showPopup(data.message, data.redirect);
            } else {
              showPopup(data.message);
            }
          } catch (error) {
            showPopup("Unable to continue right now.");
          } finally {
            forgotBusy = false;
            forgotSubmitBtn.disabled = false;
            forgotSubmitBtn.innerText = "Continue";
          }
        });
    </script>
  </body>
</html>

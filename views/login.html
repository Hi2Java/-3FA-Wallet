<!doctype html>
<html>
  <head>
    <title>FortiWallet | Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="brand-badge">FORTIWALLET</div>
      <h2>Sign In</h2>

      <form id="loginForm">
        <input type="email" name="email" placeholder="Email address" required />
        <div class="password-field">
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <button type="button" class="password-toggle" data-target="password" aria-label="Show password"></button>
        </div>

        <div class="form-utility-row">
          <a href="/forgot-password.html" class="forgot-link"
            >Forgot password?</a
          >
        </div>

        <button type="submit" id="loginSubmitBtn">Login</button>
      </form>

      <div class="link-row link-row-center">
        <a href="/register.html">Create Account</a>
      </div>
    </div>

    <div id="popup" class="popup">
      <div class="popup-content">
        <p id="popup-text"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="/popup.js"></script>
    <script>
      const loginForm = document.getElementById("loginForm");
      const loginSubmitBtn = document.getElementById("loginSubmitBtn");
      let loginBusy = false;
      document.querySelectorAll(".password-toggle").forEach((toggle) => {
        toggle.addEventListener("click", () => {
          const target = loginForm.elements[toggle.dataset.target];
          const show = target.type === "password";
          target.type = show ? "text" : "password";
          toggle.classList.toggle("is-visible", show);
          toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
        });
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (loginBusy) return;
        loginBusy = true;
        loginSubmitBtn.disabled = true;
        loginSubmitBtn.innerText = "Continue...";

        try {
          const formData = new URLSearchParams(new FormData(e.target));
          const res = await fetch("/login", { method: "POST", body: formData });
          const data = await res.json();

          if (data.success) {
            showPopup(data.message, data.redirect);
            return;
          }

          showPopup(data.message);
        } catch (error) {
          showPopup("Unable to continue login right now.");
        } finally {
          loginBusy = false;
          loginSubmitBtn.disabled = false;
          loginSubmitBtn.innerText = "Login";
        }
      });
    </script>
  </body>
</html>
